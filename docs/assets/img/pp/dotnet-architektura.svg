<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 450' width='960' height='450' role='img'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='960' height='450' rx='12' fill='#ffffff' stroke='#d1d5db'/><text x='30' y='40' font-size='20' fill='#1f2937' font-weight='700' text-anchor='start' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Z czego składa się platforma .NET</text><rect x='30' y='60' width='900' height='60' rx='10' fill='#fef3c7' stroke='#b45309' stroke-width='1.5'/><text x='480' y='86' font-size='16' fill='#b45309' font-weight='700' text-anchor='middle' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Twój program (C#, F#, Visual Basic)</text><text x='480' y='108' font-size='13' fill='#1f2937' font-weight='400' text-anchor='middle' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>kod źródłowy .cs → kompilator Roslyn → zestaw (.dll) z kodem CIL i metadanymi</text><line x1='480' y1='120' x2='480' y2='140' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><rect x='30' y='140' width='440' height='150' rx='10' fill='#dbeafe' stroke='#1d4ed8' stroke-width='1.5'/><text x='250' y='166' font-size='16' fill='#1d4ed8' font-weight='700' text-anchor='middle' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Biblioteka klas bazowych (BCL)</text><text x='50' y='194' font-size='13' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Consolas, Menlo, monospace'>System: Console, Math, String, DateTime</text><text x='50' y='218' font-size='13' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Consolas, Menlo, monospace'>System.Collections.Generic: List, Dictionary</text><text x='50' y='242' font-size='13' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Consolas, Menlo, monospace'>System.IO: pliki i foldery</text><text x='50' y='266' font-size='13' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Consolas, Menlo, monospace'>System.Linq, System.Net.Http, System.Text …</text><rect x='490' y='140' width='440' height='150' rx='10' fill='#d1fae5' stroke='#047857' stroke-width='1.5'/><text x='710' y='166' font-size='16' fill='#047857' font-weight='700' text-anchor='middle' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Środowisko uruchomieniowe (CLR)</text><text x='510' y='194' font-size='13' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>• JIT: CIL → kod maszynowy</text><text x='510' y='218' font-size='13' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>• Garbage collector: zwalnia nieużywaną pamięć</text><text x='510' y='242' font-size='13' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>• kontrola typów i bezpieczeństwo pamięci</text><text x='510' y='266' font-size='13' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>• wyjątki, wątki, ładowanie zestawów</text><line x1='480' y1='290' x2='480' y2='310' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><rect x='30' y='310' width='900' height='50' rx='10' fill='#f3f4f6' stroke='#6b7280' stroke-width='1.5'/><text x='480' y='341' font-size='15' fill='#1f2937' font-weight='600' text-anchor='middle' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>System operacyjny (Windows, Linux, macOS) i procesor (x64, ARM64)</text><rect x='30' y='380' width='900' height='52' rx='10' fill='#ede9fe' stroke='#6d28d9' stroke-width='1.5'/><text x='480' y='402' font-size='13.5' fill='#6d28d9' font-weight='700' text-anchor='middle' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>.NET SDK = środowisko uruchomieniowe + BCL + kompilator + narzędzie dotnet (build, run, new, add package)</text><text x='480' y='422' font-size='13' fill='#1f2937' font-weight='400' text-anchor='middle' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>.NET Runtime = tylko to, co potrzebne do uruchomienia gotowego programu</text></svg>