<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 750 340' width='750' height='340' role='img'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='750' height='340' rx='12' fill='#ffffff' stroke='#d1d5db'/><text x='30' y='40' font-size='20' fill='#1f2937' font-weight='700' text-anchor='start' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Dostęp przez sieć: obowiązuje bardziej restrykcyjne uprawnienie</text><rect x='30' y='70' width='300' height='110' rx='10' fill='#dbeafe' stroke='#1d4ed8' stroke-width='1.5'/><text x='180' y='100' font-size='16' fill='#1d4ed8' font-weight='700' text-anchor='middle' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Uprawnienia udziału</text><text x='180' y='124' font-size='13' fill='#1f2937' font-weight='400' text-anchor='middle' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>(Sharing → Advanced Sharing)</text><text x='180' y='156' font-size='15' fill='#1f2937' font-weight='400' text-anchor='middle' font-family='Consolas, Menlo, monospace'>Everyone: Change</text><rect x='420' y='70' width='300' height='110' rx='10' fill='#d1fae5' stroke='#047857' stroke-width='1.5'/><text x='570' y='100' font-size='16' fill='#047857' font-weight='700' text-anchor='middle' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Uprawnienia NTFS</text><text x='570' y='124' font-size='13' fill='#1f2937' font-weight='400' text-anchor='middle' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>(Security)</text><text x='570' y='156' font-size='15' fill='#1f2937' font-weight='400' text-anchor='middle' font-family='Consolas, Menlo, monospace'>Uczniowie: Read</text><text x='375' y='132' font-size='30' fill='#6b7280' font-weight='700' text-anchor='middle' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>+</text><line x1='375' y1='185' x2='375' y2='220' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><rect x='220' y='222' width='310' height='60' rx='10' fill='#fef3c7' stroke='#b45309' stroke-width='1.5'/><text x='375' y='250' font-size='16' fill='#b45309' font-weight='700' text-anchor='middle' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Uczeń przez sieć: Read</text><text x='375' y='270' font-size='13' fill='#1f2937' font-weight='400' text-anchor='middle' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>wygrywa ostrzejsze z dwóch</text><text x='30' y='315' font-size='14' fill='#6b7280' font-weight='400' text-anchor='start' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Przy pracy lokalnej (przy tym samym komputerze) liczą się tylko uprawnienia NTFS.</text></svg>