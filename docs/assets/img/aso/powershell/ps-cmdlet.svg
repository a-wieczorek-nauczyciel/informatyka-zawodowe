 x='350' y='150' font-size='15' fill='#047857' font-weight='700' text-anchor='start' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>parametr</text><text x='350' y='170' font-size='14' fill='#6b7280' font-weight='400' text-anchor='start' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>jak dokładnie</text><text x='500' y='110' font-size='28' fill='#b91c1c' font-weight='700' text-anchor='start' font-family='Consolas, Menlo, monospace'>notepad</text><line x1='500' y1='122' x2='619' y2='122' stroke='#b91c1c' stroke-width='3'/><text x='500' y='150' font-size='15' fill='#b91c1c' font-weight='700' text-anchor='start' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>argument</text><text x='500' y='170' font-size='14' fill='#6b7280' font-weight='400' text-anchor='start' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>wartość</text><text x='30' y='210' font-size='14' fill='#1f2937' font-weight='400' text-anchor='start' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Znasz czasownik i rzeczownik, więc zgadniesz polecenie: Get-Service, Stop-Service, Restart-Service.</text></svg>