site_name: Materiały — Informatyka
site_url: https://a-wieczorek-nauczyciel.github.io/informatyka-zawodowe/
theme:
  name: material
  language: pl
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Przełącz na tryb ciemny
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Przełącz na tryb jasny
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - toc.integrate
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Start: index.md
  - Podstawy Programowania:
      - podstawy-programowania/index.md
      - Klasa 3:
          - podstawy-programowania/klasa-3/index.md
          - Funkcje. Funkcje biblioteczne:
              - podstawy-programowania/klasa-3/01-funkcje/index.md
              - Czym jest funkcja: podstawy-programowania/klasa-3/01-funkcje/01-czym-jest-funkcja/index.md
              - Parametry i argumenty: podstawy-programowania/klasa-3/01-funkcje/02-parametry-i-argumenty/index.md
              - Moduły i biblioteki: podstawy-programowania/klasa-3/01-funkcje/03-moduly-i-biblioteki/index.md
              - Zadania utrwalające: podstawy-programowania/klasa-3/01-funkcje/04-zadania-utrwalajace/index.md
          - Zasady programowania obiektowego:
              - podstawy-programowania/klasa-3/02-zasady-programowania-obiektowego/index.md
              - Czym jest programowanie obiektowe: podstawy-programowania/klasa-3/02-zasady-programowania-obiektowego/01-czym-jest-programowanie-obiektowe/index.md
              - Podstawowe pojęcia: podstawy-programowania/klasa-3/02-zasady-programowania-obiektowego/02-podstawowe-pojecia/index.md
              - Zadania utrwalające: podstawy-programowania/klasa-3/02-zasady-programowania-obiektowego/03-zadania-utrwalajace/index.md
          - Klasy i obiekty:
              - podstawy-programowania/klasa-3/03-klasy-i-obiekty/index.md
              - Pola i metody: podstawy-programowania/klasa-3/03-klasy-i-obiekty/01-pola-i-metody/index.md
              - Konstruktor: podstawy-programowania/klasa-3/03-klasy-i-obiekty/02-konstruktor/index.md
              - Specyfikatory dostępu: podstawy-programowania/klasa-3/03-klasy-i-obiekty/03-specyfikatory-dostepu/index.md
              - Składniki statyczne: podstawy-programowania/klasa-3/03-klasy-i-obiekty/04-skladniki-statyczne/index.md
              - Destruktor i klasy zaprzyjaźnione: podstawy-programowania/klasa-3/03-klasy-i-obiekty/05-destruktor-i-klasy-zaprzyjaznione/index.md
              - Zadania utrwalające: podstawy-programowania/klasa-3/03-klasy-i-obiekty/06-zadania-utrwalajace/index.md
      - Klasa 4: podstawy-programowania/klasa-4/index.md
      - Powtórka: podstawy-programowania/powtorka/index.md
  - ASO:
      - aso/index.md
      - Klasa 2:
          - aso/klasa-2/index.md
          - Wirtualizacja i instalacja systemów operacyjnych:
              - aso/klasa-2/01-wirtualizacja-i-instalacja/index.md
              - Czym jest wirtualizacja: aso/klasa-2/01-wirtualizacja-i-instalacja/01-czym-jest-wirtualizacja/index.md
              - Planowanie instalacji: aso/klasa-2/01-wirtualizacja-i-instalacja/02-planowanie-instalacji/index.md
              - Instalacja Windows: aso/klasa-2/01-wirtualizacja-i-instalacja/03-instalacja-windows/index.md
              - Instalacja Linux: aso/klasa-2/01-wirtualizacja-i-instalacja/04-instalacja-linux/index.md
              - Zadania utrwalające: aso/klasa-2/01-wirtualizacja-i-instalacja/05-zadania-utrwalajace/index.md
      - Klasa 3: aso/klasa-3/index.md
