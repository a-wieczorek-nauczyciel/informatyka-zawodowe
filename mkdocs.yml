site_name: Materiały — Informatyka
site_url: https://a-wieczorek-nauczyciel.github.io/informatyka-zawodowe/
theme:
  name: material
  language: pl
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Przełącz na tryb ciemny
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Przełącz na tryb jasny
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - toc.integrate
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Start: index.md
  - Podstawy Programowania:
      - podstawy-programowania/index.md
      - Klasa 3:
          - podstawy-programowania/klasa-3/index.md
