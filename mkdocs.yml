site_name: Materiały — Informatyka
site_url: https://a-wieczorek-nauczyciel.github.io/informatyka-zawodowe/
theme:
  name: material
  language: pl
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Przełącz na tryb ciemny
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Przełącz na tryb jasny
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - toc.integrate
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Start: index.md
  - Podstawy Programowania:
      - podstawy-programowania/index.md
      - Klasa 3:
          - podstawy-programowania/klasa-3/index.md
          - Funkcje. Funkcje biblioteczne:
              - podstawy-programowania/klasa-3/01-funkcje/index.md
              - Czym jest funkcja: podstawy-programowania/klasa-3/01-funkcje/01-czym-jest-funkcja/index.md
              - Parametry i argumenty: podstawy-programowania/klasa-3/01-funkcje/02-parametry-i-argumenty/index.md
              - Moduły i biblioteki: podstawy-programowania/klasa-3/01-funkcje/03-moduly-i-biblioteki/index.md
              - Zadania utrwalające: podstawy-programowania/klasa-3/01-funkcje/04-zadania-utrwalajace/index.md
      - Klasa 4: podstawy-programowania/klasa-4/index.md
      - Powtórka: podstawy-programowania/powtorka/index.md
  - ASO:
      - aso/index.md
      - Klasa 2: aso/klasa-2/index.md
      - Klasa 3: aso/klasa-3/index.md
