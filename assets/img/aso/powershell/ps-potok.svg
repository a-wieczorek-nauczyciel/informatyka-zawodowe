<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 200' width='1000' height='200' role='img'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='1000' height='200' rx='12' fill='#ffffff' stroke='#d1d5db'/><text x='30' y='40' font-size='20' fill='#1f2937' font-weight='700' text-anchor='start' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Potok | przekazuje obiekty od lewej do prawej</text><rect x='30' y='70' width='220' height='70' rx='10' fill='#dbeafe' stroke='#1d4ed8' stroke-width='1.5'/><text x='140' y='100' font-size='12.5' fill='#1d4ed8' font-weight='700' text-anchor='middle' font-family='Consolas, Menlo, monospace'>Get-Process</text><text x='140' y='124' font-size='13' fill='#1f2937' font-weight='400' text-anchor='middle' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>wszystkie procesy</text><line x1='250' y1='105' x2='273' y2='105' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><rect x='275' y='70' width='220' height='70' rx='10' fill='#dbeafe' stroke='#1d4ed8' stroke-width='1.5'/><text x='385' y='100' font-size='12.5' fill='#1d4ed8' font-weight='700' text-anchor='middle' font-family='Consolas, Menlo, monospace'>Sort-Object CPU -Descending</text><text x='385' y='124' font-size='13' fill='#1f2937' font-weight='400' text-anchor='middle' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>te same, posortowane</text><line x1='495' y1='105' x2='518' y2='105' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><rect x='520' y='70' width='220' height='70' rx='10' fill='#dbeafe' stroke='#1d4ed8' stroke-width='1.5'/><text x='630' y='100' font-size='12.5' fill='#1d4ed8' font-weight='700' text-anchor='middle' font-family='Consolas, Menlo, monospace'>Select-Object -First 5</text><text x='630' y='124' font-size='13' fill='#1f2937' font-weight='400' text-anchor='middle' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>pięć pierwszych</text><line x1='740' y1='105' x2='763' y2='105' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><rect x='765' y='70' width='220' height='70' rx='10' fill='#dbeafe' stroke='#1d4ed8' stroke-width='1.5'/><text x='875' y='100' font-size='12.5' fill='#1d4ed8' font-weight='700' text-anchor='middle' font-family='Consolas, Menlo, monospace'>Out-File top5.txt</text><text x='875' y='124' font-size='13' fill='#1f2937' font-weight='400' text-anchor='middle' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>zapis do pliku</text><text x='30' y='175' font-size='14' fill='#6b7280' font-weight='400' text-anchor='start' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Między ogniwami płyną całe obiekty. Zmienia się ich liczba i kolejność, ale nic nie trzeba wycinać z tekstu.</text></svg>