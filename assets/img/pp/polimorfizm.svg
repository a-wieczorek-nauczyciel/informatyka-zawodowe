<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 830 260' width='830' height='260' role='img'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect width='830' height='260' rx='12' fill='#ffffff' stroke='#d1d5db'/><text x='30' y='40' font-size='20' fill='#1f2937' font-weight='700' text-anchor='start' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Polimorfizm: ta sama metoda, różne zachowanie</text><rect x='30' y='60' width='420' height='150' rx='8' fill='#012456' stroke='#012456' stroke-width='1.5'/><rect x='30' y='60' width='420' height='26' rx='8' fill='#e5e7eb'/><rect x='30' y='78' width='420' height='8' fill='#e5e7eb'/><text x='42' y='78' font-size='12' fill='#374151' font-weight='400' text-anchor='start' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Program.cs</text><text x='44' y='108' font-size='14' fill='#93c5fd' font-weight='400' text-anchor='start' font-family='Consolas, Menlo, monospace'>List&lt;Ksztalt&gt; ksztalty = new() {</text><text x='44' y='130' font-size='14' fill='#93c5fd' font-weight='400' text-anchor='start' font-family='Consolas, Menlo, monospace'>  new Kolo(2), new Prostokat(3, 4),</text><text x='44' y='152' font-size='14' fill='#93c5fd' font-weight='400' text-anchor='start' font-family='Consolas, Menlo, monospace'>  new Trojkat(3, 4, 5) };</text><text x='44' y='174' font-size='14' fill='#fde68a' font-weight='400' text-anchor='start' font-family='Consolas, Menlo, monospace'>foreach (Ksztalt k in ksztalty)</text><text x='44' y='196' font-size='14' fill='#fde68a' font-weight='400' text-anchor='start' font-family='Consolas, Menlo, monospace'>  Console.WriteLine(k.Pole());</text><rect x='500' y='66' width='300' height='42' rx='10' fill='#dbeafe' stroke='#1d4ed8' stroke-width='1.5'/><text x='516' y='93' font-size='14' fill='#1d4ed8' font-weight='700' text-anchor='start' font-family='Consolas, Menlo, monospace'>Kolo.Pole()</text><text x='784' y='93' font-size='13.5' fill='#1f2937' font-weight='400' text-anchor='end' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>π · r²  →  12,57</text><line x1='450' y1='150' x2='498' y2='87' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><rect x='500' y='118' width='300' height='42' rx='10' fill='#d1fae5' stroke='#047857' stroke-width='1.5'/><text x='516' y='145' font-size='14' fill='#047857' font-weight='700' text-anchor='start' font-family='Consolas, Menlo, monospace'>Prostokat.Pole()</text><text x='784' y='145' font-size='13.5' fill='#1f2937' font-weight='400' text-anchor='end' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>a · b  →  12</text><line x1='450' y1='150' x2='498' y2='139' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><rect x='500' y='170' width='300' height='42' rx='10' fill='#fef3c7' stroke='#b45309' stroke-width='1.5'/><text x='516' y='197' font-size='14' fill='#b45309' font-weight='700' text-anchor='start' font-family='Consolas, Menlo, monospace'>Trojkat.Pole()</text><text x='784' y='197' font-size='13.5' fill='#1f2937' font-weight='400' text-anchor='end' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>wzór Herona  →  6</text><line x1='450' y1='150' x2='498' y2='191' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><text x='30' y='240' font-size='14' fill='#6b7280' font-weight='400' text-anchor='start' font-family='Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Zmienna jest typu Ksztalt, ale wywołuje się wersja metody z klasy, którą obiekt naprawdę jest.</text></svg>